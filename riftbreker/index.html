<html lang="nl"><head><meta charset="utf-8">

<style>

.btn{background:linear-gradient(#5a3a1a,#2e1d0e);border:1px solid #b07a3a;border-radius:8px;padding:10px 14px;color:#ffe2b0;text-shadow:0 1px 2px #000;box-shadow:0 2px 0 #000,inset 0 1px 0 #ffffff22}

#tinfo{display:flex;justify-content:space-between;font-size:13px;margin:3px 2px;text-shadow:0 1px 3px #000}

@keyframes tin{from{transform:translateX(40px);opacity:0}}@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

#banner.on{animation:ban 2.6s}@keyframes ban{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}

.big-n{font-size:34px;color:#c98aff;text-align:center;text-shadow:0 0 12px #80f}
</style></head><body>

</div>
<div id="menu" class="scr"><h1>RIFTBREKER</h1><div class="res" id="res"></div><div id="mbody"></div>
 <div id="tabs"><button data-tab="rift"><span>🌀</span>Rift</button><button data-tab="gear"><span>🛡️</span>Uitrusting</button><button data-tab="para"><span>✴️</span>Paragon</button><button data-tab="smith"><span>⚒️</span>Smid</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ================= helpers =================
const $=s=>document.querySelector(s),R=Math.random,rr=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rr(a,b+1)),pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const fmt=n=>{if(n<1e4)return Math.round(n)+'';const u=['K','M','B','T','Qa','Qi','Sx','Sp','Oc'];let i=-1;while(n>=1e3&&i<u.length-1){n/=1e3;i++}return n.toFixed(n<10?2:n<100?1:0)+u[i]};
const SC=l=>Math.pow(1.14,l), MS=l=>Math.pow(1.16,l);   // item scaling vs monster scaling
const KEY='riftbreker1';

// ================= data =================
const SLOTS=['weapon','helm','chest','gloves','boots','ring','amulet'];
const SLN={weapon:'Wapen',helm:'Helm',chest:'Borst',gloves:'Handschoenen',boots:'Laarzen',ring:'Ring',amulet:'Amulet'};
const SLI={weapon:'🗡️',helm:'⛑️',chest:'🥋',gloves:'🧤',boots:'🥾',ring:'💍',amulet:'📿'};
const BASES={weapon:['Staf','Toverstok','Zwaard','Bijl','Scepter'],helm:['Kap','Helm','Kroon'],chest:['Gewaad','Harnas','Mantel'],gloves:['Handschoenen','Klauwen'],boots:['Laarzen','Treden'],ring:['Ring','Zegelring'],amulet:['Amulet','Talisman','Hanger']};
const PRE=['Gloeiende','Vervloekte','Duistere','Gezegende','Wrede','Stille','Brandende','IJzige','Oude','Heilige','Bloedige','Gevallen'];
const RAR=[{n:'Normaal',c:'#c8c8c8'},{n:'Magisch',c:'#6b8cff'},{n:'Zeldzaam',c:'#ffd84a'},{n:'Legendarisch',c:'#ff8a1c'},{n:'Set',c:'#3dff6a'}];
const ANC=['','Oud','Oeroud'];
const icol=it=>it.anc===2?'#ff3a3a':RAR[it.rar].c;
const AFF={dmg:{n:'% Schade',lo:6,hi:14},cc:{n:'% Kritieke kans',lo:2,hi:5},cd:{n:'% Kritieke schade',lo:12,hi:35},as:{n:'% Aanvalssnelheid',lo:3,hi:8},
 life:{n:' Leven',lo:15,hi:35,sc:1},regen:{n:' Leven/sec',lo:1,hi:3,sc:1},armor:{n:' Pantser',lo:6,hi:14,sc:1},ms:{n:'% Loopsnelheid',lo:3,hi:7},
 area:{n:'% Effectgebied',lo:5,hi:12},cdr:{n:'% Afkoeltijd-reductie',lo:3,hi:7},elite:{n:'% Schade vs. elites',lo:8,hi:20},pick:{n:'% Oppakradius',lo:10,hi:25},
 mf:{n:'% Magische vindkans',lo:5,hi:15},gf:{n:'% Extra goud',lo:8,hi:20},xp:{n:'% Ervaring',lo:5,hi:12}};
const AK=Object.keys(AFF);
const LEG={split:{d:'Magische schichten splitsen in 3 bij inslag',n:['Splijter van Vael','Driespraak']},
 orbs:{d:'+2 Arcane bollen, die 50% sneller draaien',n:['Ster van Ilmar','Omloop der Wijzen']},
 chain:{d:'Kettingbliksem kaatst +4 keer en doet +50% schade',n:['Stormvanger','Donderkroon']},
 nova:{d:'Vorstnova bevriest 2s en doet +150% schade',n:['Hart van de Winter','IJzel']},
 meteor:{d:'Meteoren: 2× radius en vallen 40% vaker',n:['Ster van Ondergang','Hemelval']},
 boom:{d:'Vijanden ontploffen bij dood (300% wapenschade)',n:['Lijkbloesem','Rouwvuur']},
 vamp:{d:'Elke kill herstelt 1% leven',n:['Bloedkelk','Rode Dorst']},
 crit:{d:'Kritieke treffers doen +100% schade',n:['Oog van Kaz','Scherprechter']},
 aura:{d:'Vuuraura: 2× radius en +100% schade',n:['Smeltkroes','Asgloed']},
 frenzy:{d:'Elke kill: +2% aanvalssnelheid (max 50×, 4s)',n:['Razernij','Kraaienvleugel']},
 elite:{d:'+100% schade tegen elites en bewakers',n:['Koningsdoder','Reuzenval']},
 greed:{d:'3× oppakradius en +100% goud',n:['Gierige Vuist','Goudkoorts']},
 multi:{d:'+2 projectielen voor Magische schicht',n:['Waaier van Sel','Veelvoud']}};
const LK=Object.keys(LEG);
const SETS={fire:{n:'Vuurvogel',b2:'+1 Meteoor-niveau en +30% schade',b4:'Meteoor & Vuuraura doen 6× schade; je start met beide'},
 storm:{n:'Stormheer',b2:'+3 bliksemkaatsingen',b4:'Kettingbliksem doet 6× schade en vuurt 2× zo snel; je start ermee'},
 arcane:{n:'Wachter',b2:'+2 Arcane bollen',b4:'Bollen & Schichten doen 5× schade; je start met Bollen'}};
const SK={bolt:{n:'Magische schicht',i:'✨',d:'Schichten op de dichtstbijzijnde vijand'},orbs:{n:'Arcane bollen',i:'🔮',d:'Bollen draaien om je heen'},
 chain:{n:'Kettingbliksem',i:'⚡',d:'Bliksem springt tussen vijanden'},nova:{n:'Vorstnova',i:'❄️',d:'IJzige golf die vertraagt'},
 meteor:{n:'Meteoor',i:'☄️',d:'Meteoren slaan in tussen vijanden'},aura:{n:'Vuuraura',i:'🔥',d:'Verbrandt alles dichtbij'}};
const PAS={pow:{n:'Kracht',i:'💪',d:'+20% schade'},haste:{n:'Haast',i:'⏩',d:'+12% aanvalssnelheid'},area:{n:'Reikwijdte',i:'🌀',d:'+15% effectgebied'},
 vit:{n:'Vitaliteit',i:'❤️',d:'+20% max leven, volledig genezen'},swift:{n:'Lichtvoetig',i:'👟',d:'+10% loopsnelheid'},magnet:{n:'Magneet',i:'🧲',d:'+50% oppakradius'},
 luck:{n:'Fortuin',i:'🍀',d:'+30% kans op legendarische items'},crit:{n:'Precisie',i:'🎯',d:'+5% kritieke kans, +25% kritieke schade'}};
const PARA={dmg:{n:'Kracht',d:'+1% schade'},crit:{n:'Precisie',d:'+0,1% krit. kans, +1% krit. schade'},life:{n:'Vitaliteit',d:'+2% leven, +1% pantser'},spd:{n:'Snelheid',d:'+0,5% aanvalssnelh., +0,2% loopsnelh.'}};
const THEMES=[{n:'Helse Diepten',f:0x1a0605,g:0x8a4a3a,c:0xff3a1a},{n:'Bevroren Crypte',f:0x060c18,g:0x5a6a8a,c:0x4ac8ff},{n:'Gifmoeras',f:0x07120a,g:0x4a6a3a,c:0x7aff3a},{n:'De Leegte',f:0x0d0619,g:0x5a4a8a,c:0xc04aff},{n:'Zandgraf',f:0x150f06,g:0x8a7a4a,c:0xffb03a}];
const SHR=[{k:'pow',n:'Krachtschrijn',d:'2× schade',c:0xff4a2a},{k:'fren',n:'Razernijschrijn',d:'+50% snelheid',c:0xffd02a},{k:'cond',n:'Geleidingsschrijn',d:'Bliksemstorm',c:0x6ac8ff}];

// ================= save =================
const DEF=()=>({gold:0,shards:0,keys:0,grMax:0,grUnl:1,grSel:1,tor:1,pl:0,pxp:0,pts:0,pa:{dmg:0,crit:0,life:0,spd:0},inv:[],eq:{},auto:0,uid:1,st:{runs:0,legs:0,kills:0}});
let S;try{S=Object.assign(DEF(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=DEF()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
if(!S.eq.weapon)S.eq.weapon={id:S.uid++,slot:'weapon',rar:0,ilvl:0,anc:0,aff:[],dmg:9,name:'Versleten Staf',wb:0};if(S.eq.weapon.name==='Versleten Staf')S.eq.weapon.wb=0;
const torMax=()=>Math.min(40,1+Math.floor(S.grMax/4));
const refL=()=>Math.max(S.grMax,(S.tor-1)*4);

// ================= items =================
function genItem(L,minRar=0,mf=0){
 const slot=pick(SLOTS),r=R(),lc=Math.min(.25,.008*(1+L*.03)*(1+mf)),rc=.12*(1+mf*.5);
 let rar=r<lc?3:r<lc+rc?2:r<lc+rc+.4?1:0;rar=Math.max(rar,minRar);
 if(rar===3&&R()<.22)rar=4;
 const it={id:S.uid++,slot,rar,ilvl:Math.max(0,Math.round(L)),anc:0,aff:[]};
 if(rar>=3){if(L>=15&&R()<.008+L*.0002)it.anc=2;else if(R()<.1)it.anc=1}
 rollItem(it);
 if(rar===3){it.leg=pick(LK);it.name=pick(LEG[it.leg].n)}
 else if(rar===4){it.set=pick(Object.keys(SETS));it.name=pick(BASES[slot])+' van de '+SETS[it.set].n}
 else{const bn=pick(BASES[slot]);it.name=(rar?pick(PRE)+' ':'')+bn;if(slot==='weapon')it.wb=BASES.weapon.indexOf(bn)}
 if(slot==='weapon'&&it.wb===undefined)it.wb=ri(0,4);
 return it}
function rollItem(it){
 const q=()=>it.anc===2?1:rr(.15,1),m=(it.anc?1.3:1)*[.75,.85,1,1.12,1.12][it.rar],s=SC(it.ilvl);
 if(it.slot==='weapon')it.dmg=Math.round(10*s*m*(.85+.15*q()));else it.arm=Math.round(5*s*m*(.85+.15*q()));
 const n=[0,ri(1,2),ri(3,4),4,4][it.rar],keys=AK.slice().sort(()=>R()-.5);it.aff=[];
 if(it.slot==='weapon'&&it.rar){keys.splice(keys.indexOf('dmg'),1);keys.unshift('dmg')}
 if(it.rar>=3&&(it.slot==='weapon'||it.slot==='amulet')&&R()<.35)it.aff.push({k:'proj',v:1});
 for(let i=0;i<n;i++){const a=AFF[keys[i]];let v=(a.lo+(a.hi-a.lo)*q())*(a.sc?s:1)*(it.anc?1.3:1);it.aff.push({k:keys[i],v:v<20?Math.round(v*10)/10:Math.round(v)})}
}
const affTxt=a=>a.k==='proj'?'+1 Projectiel':'+'+(a.v>=1e4?fmt(a.v):a.v)+AFF[a.k].n;
function calcStats(eq){
 const s={wd:4,dmg:0,cc:5,cd:50,as:0,life:0,regen:0,armor:0,ms:0,area:0,cdr:0,elite:0,pick:0,mf:0,gf:0,xp:0,proj:0,legs:{},sets:{}},P=S.pa;
 for(const k of SLOTS){const it=eq[k];if(!it)continue;if(it.dmg)s.wd=it.dmg;if(it.arm)s.armor+=it.arm;
  for(const a of it.aff)s[a.k]+=a.v;if(it.leg)s.legs[it.leg]=1;if(it.set)s.sets[it.set]=(s.sets[it.set]||0)+1}
 s.dmg+=P.dmg;s.cc+=P.crit*.1;s.cd+=P.crit;s.as+=P.spd*.5;s.ms+=P.spd*.2;s.armor*=1+P.life*.01;
 if((s.sets.fire||0)>=2)s.dmg+=30;
 s.hp=(100+s.life)*(1+P.life*.02);
 s.dps=s.wd*(1+s.dmg/100)*(1+Math.min(s.cc,90)/100*s.cd/100*(s.legs.crit?2:1))*(1+s.as/100)*(1+s.proj*.3);
 const dr=s.armor/(s.armor+30*MS(refL()));s.tough=s.hp/(1-dr);s.dr=dr;return s}
const salvVal=it=>[1,2,4,15,15][it.rar]*(it.anc===2?10:it.anc?2:1);
function salvage(it){S.inv=S.inv.filter(x=>x!==it);S.shards+=salvVal(it)}

// ================= audio =================
let AC=null;const sfxT={};
function sfx(k){if(!AC)return;const now=AC.currentTime;if(sfxT[k]>now-.05&&k==='hit')return;sfxT[k]=now;
 const tone=(f,d,type='sine',v=.15,t0=0,f2)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,now+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,now+t0+d);
  g.gain.setValueAtTime(v,now+t0);g.gain.exponentialRampToValueAtTime(.001,now+t0+d);o.connect(g).connect(AC.destination);o.start(now+t0);o.stop(now+t0+d)};
